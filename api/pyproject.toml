[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "activetigger"
authors = [{name = "Émilien Schultz - Julien Boelaert - Étienne Ollion", email = "emilien.schultz@ensae.fr"}]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: MIT License"]
dynamic = ["version", "description"]
requires-python = ">= 3.11,<3.14"
dependencies = [
		"fastapi[all]",
		"sentencepiece",
		"requests",
		"uvicorn",
		"argparse",
		"datasets",
		"fasttext @ git+https://github.com/facebookresearch/fastText.git@main",
		"ipywidgets",
		"pyyaml",
		"types-PyYAML",
		"IPython",
		"numpy",
		"pandas",
		"pyarrow",
		"transformers[torch]>=4.51.0",
		"sentence-transformers>=5.4.0",
		"typing-inspect",
		"typing-extensions",
		"spacy>=3.8",
		"pyyaml",
		"protobuf",
		"umap-learn",
		"distinctipy",
		"python-jose[cryptography]",
		"bcrypt",
		"plotly",
		"matplotlib",
		"scikit-learn",
		"loky",
		"einops",
		"accelerate>=1.13.0",
		"sacremoses>=0.1.1",
		"python-multipart>=0.0.22",
		"openai>=2.26.0",
		"sqlalchemy>=2.0.48",
		"python-slugify>=8.0.4",
		"psutil>=7.2.2",
		"openpyxl>=3.1.5",
		"ruff>=0.15.5",
		"black>=26.3.0",
		"types-python-jose>=3.5.0.20250531",
		"types-psutil>=7.2.2.20260130",
		"pandas-stubs>=3.0.0.260204",
		"psycopg2>=2.9.11",
		"python-dotenv>=1.2.2",
		"aiofiles>=25.1.0",
		"bertopic>=0.17.4",
		"hdbscan>=0.8.41",
		"simplemma>=1.1.2",
		"nbformat>=5.10.4",
		"great-tables>=0.21.0",
		"pytz>=2026.1.post1",
		"fr-core-news-sm",
		"en-core-web-sm",
		"setuptools",
		"nltk",
		"peft>=0.18.1",
		"regex>=2024.0.0",
		"open-clip-torch>=3.3.0",
		"codecarbon>=2.7.0",
		"wtpsplit>=2.1.0",
		"python-docx>=1.1.0",
		"task_manager"
]

# torch/torchvision live in mutually exclusive extras (see tool.uv.conflicts):
# `--extra cpu` pins them to the CPU-only PyTorch index, `--extra gpu` uses PyPI
# CUDA builds. transformers[torch] still pulls torch transitively, so a plain
# `uv sync` without an extra falls back to the PyPI (CUDA) build.
[project.optional-dependencies]
cpu = ["torch>=2.6.0", "torchvision>=0.21.0"]
gpu = ["torch>=2.6.0", "torchvision>=0.21.0"]

[dependency-groups]
dev = [
    "coverage>=7.13.5",
    "pytest>=9.0.3",
    "ty>=0.0.31",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = [
#  "B",           # flake8-bugbear
  "I",           # isort
# that will be a problem for pytest fixture unless you swap with the usefixture decorator https://docs.pytest.org/en/7.1.x/how-to/fixtures.html#use-fixtures-in-classes-and-modules-with-usefixtures
#  "ARG",         # flake8-unused-arguments
#  "C4",          # flake8-comprehensions
#  "EM",          # flake8-errmsg
  "ICN",         # flake8-import-conventions
#  "G",           # flake8-logging-format
  "PGH",         # pygrep-hooks
#  "PIE",         # flake8-pie
#  "PL",          # pylint
#  "PTH",         # flake8-use-pathlib
#  "PT",          # flake8-pytest-style
#  "RET",         # flake8-return
#  "RUF",         # Ruff-specific
#  "SIM",         # flake8-simplify
#  "T20",         # flake8-print
#  "UP",          # pyupgrade
  "YTT",         # flake8-2020
  "EXE",         # flake8-executable
#  "PYI",         # flake8-pyi
#  "S",           # flake8-bandit
]
ignore = [
#  "E501",     # E501 Line too long (158 > 100 characters)
#  "SIM105",   # SIM105 Use `contextlib.suppress(...)`
#  "PLR",      # Design related pylint codes
#  "S101",     # Use of `assert` detected
]
unfixable = [
  # Don't touch print statements
  "T201",
  # Don't touch noqa lines
  "RUF100",
]

[tool.ty.src]
exclude = ["migrations/"]

[tool.ty.rules]
all = "error"

[tool.uv]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]

conflicts = [
    [{ extra = "cpu" }, { extra = "gpu" }],
]

[tool.uv.sources]
fr-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/fr_core_news_sm-3.8.0/fr_core_news_sm-3.8.0.tar.gz" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0.tar.gz" }
torch = [{ index = "pytorch-cpu", extra = "cpu" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" }]
task_manager = { workspace = true }	

[tool.uv.workspace]
members = ["task_manager"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.coverage.run]
source = ["activetigger"]

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true
