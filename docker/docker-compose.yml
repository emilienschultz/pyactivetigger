services:
  postgres:
    image: postgres:${POSTGRES_VERSION}
    restart: ${RESTART_POLICY}
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ${DATA_PATH}/postgresql/:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 10
  api:
    build:
      # Repo root: the Dockerfile COPYs api/ and docker/api/entrypoint.sh
      # (shadowed by the bind mounts below in the compose stack).
      context: ..
      dockerfile: docker/api/Dockerfile
      args:
        - PYTHON_VERSION=${PYTHON_VERSION}
        - USER_ID=${USER_ID}
        - GROUP_ID=${GROUP_ID}
    entrypoint: /entrypoint.sh
    restart: ${RESTART_POLICY}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${PROJECT_PATH}/docker/api/entrypoint.sh:/entrypoint.sh
      - ${PROJECT_PATH}/api:/api
      - ${DATA_PATH}:/data
      - venv_data:/home/python/venv
      - uv_cache:/home/python/.cache/uv
      - hf_cache:/home/python/.cache/huggingface
    env_file: ".env"
    environment:
      - USER_ID=${USER_ID}
      - GROUP_ID=${GROUP_ID}
      - DATA_PATH=/data
      - CPU_ONLY=true
      - UV_CACHE_DIR=/home/python/.cache/uv
      - HF_HOME=/home/python/.cache/huggingface
      - UV_LINK_MODE=copy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c "import urllib.request; urllib.request.urlopen(''http://localhost:4000/version'', timeout=5)" || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
  frontend:
    image: node:${NODE_VERSION}
    entrypoint: /entrypoint.sh
    restart: ${RESTART_POLICY}
    volumes:
      - ${PROJECT_PATH}/docker/frontend/entrypoint.sh:/entrypoint.sh
      - ${PROJECT_PATH}/frontend:/frontend
      - frontend_node_modules:/frontend/node_modules
    environment:
      - API_PORT=${API_PORT}
      - MODE=${MODE}
      - VITE_API_URL=${API_URL}
  redis:
    image: redis:${REDIS_VERSION}
volumes:
  venv_data:
  uv_cache:
  hf_cache:
  frontend_node_modules:
